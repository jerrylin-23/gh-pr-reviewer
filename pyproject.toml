[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-pr-reviewer"
version = "0.1.0"
description = "AI-powered GitHub PR Reviewer using Claude/Antigravity CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "textual>=1.0.0",
]

[project.scripts]
pr-reviewer = "gh_pr_reviewer.main:app"
pr-reviewer-tui = "gh_pr_reviewer.tui:run_tui"
