appId: com.ghprreviewer.desktop
productName: PR Reviewer
copyright: MIT

directories:
  output: release
  buildResources: build

# Only the built output ships. Sources, tests, and node_modules stay out.
files:
  - dist/**
  - dist-electron/**
  - package.json

# The frozen Python engine ships inside the app, so the host needs no Python.
# Build it first with `npm run build:backend`.
extraResources:
  - from: ../packaging/backend-dist/pr-reviewer-api
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__'
      - '!**/*.pyc'

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  icon: ../packaging/assets/AppIcon.icns
  darkModeSupport: true
  # Code signing and notarization are release requirements that are not set up
  # yet. Without them macOS shows a Gatekeeper warning on first launch.
  identity: null

# The app is ad-hoc signed after packing. macOS on Apple silicon refuses to
# start a bundle that has no valid signature.
afterPack: scripts/adhoc-sign.mjs

dmg:
  title: PR Reviewer
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
